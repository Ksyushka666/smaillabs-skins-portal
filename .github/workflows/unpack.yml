name: Expand source archive



on:

  push:
  
    branches: [main]
    


permissions:

  contents: write
  


jobs:

  expand:
  
    if: github.event.head_commit.message != 'Expand source archive'
    
    runs-on: ubuntu-latest
    
    steps:
    
      - uses: actions/checkout@v4
      
      - name: Expand project files
      
        run: |
        
          tar -xzf smaillabs-source.tar.gz
          
          rm smaillabs-source.tar.gz
          
          git config user.name 'github-actions[bot]'
          
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          
          git add -A
          
          git commit -m 'Expand source archive'
          
          git push
          

















